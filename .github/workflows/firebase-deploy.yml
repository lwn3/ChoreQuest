name: Deploy ChoreQuest to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: chorequest-3a721
          workload_identity_provider: projects/475400353768/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@chorequest-3a721.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Reset players for Class Tree V2
        run: node functions/scripts/reset-class-system-v2.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy Firebase
        run: firebase deploy --project chorequest-3a721 --only hosting,functions,firestore --non-interactive
